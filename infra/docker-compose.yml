# Laptop-friendly streaming stack.
# Redpanda = Kafka-compatible broker. Flink = stream processor (PyFlink inside).
# Usage:  docker compose -f infra/docker-compose.yml up -d --build
# Topics: docker exec redpanda rpk topic create transactions drift-alerts -p 1 -r 1

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.1
    container_name: redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:29092,external://localhost:9092
    ports:
      - "9092:9092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  jobmanager:
    build: ./flink
    image: drift-monitor-flink:1.20.1
    container_name: flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1024m
    volumes:
      - ../streaming:/opt/flink/jobs

  taskmanager:
    image: drift-monitor-flink:1.20.1
    container_name: flink-taskmanager
    command: taskmanager
    depends_on:
      - jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 1
        taskmanager.memory.process.size: 1536m
    volumes:
      - ../streaming:/opt/flink/jobs

volumes:
  redpanda-data:
