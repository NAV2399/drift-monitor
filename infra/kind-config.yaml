# kind cluster — SINGLE NODE on purpose (laptop-friendly).
# Only needed in Week 4 for the deployment story. Weeks 1-3 use docker-compose.
# Usage: kind create cluster --config infra/kind-config.yaml --name drift
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 9092   # Kafka/Redpanda
        hostPort: 9092
      - containerPort: 8081   # Flink UI
        hostPort: 8081
